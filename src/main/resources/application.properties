spring.application.name=oficina-billing

# Servidor
server.port=8080
server.servlet.context-path=/billing/v1

# Datasource (banco próprio do Billing)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/billing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:5}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ (mensageria da Saga, o mesmo broker do OS Service)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# O envio do outbox espera a confirmação do broker antes de marcar o evento como publicado
spring.rabbitmq.publisher-confirm-type=simple
# Consumo: falha transitória ganha 2 novas tentativas (3 no total) com espera crescente; esgotadas, ou
# em rejeição definitiva, a mensagem vai para a DLQ e nunca volta sozinha (ver ConsumoRetryConfig). No
# Boot 4 a propriedade é max-retries (novas tentativas).
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2

# Topologia e outbox (contrato com o OS Service em docs/mensageria.md)
oficina.mensageria.exchange-os=os.eventos
oficina.mensageria.exchange-billing=billing.eventos
oficina.mensageria.fila-entrada=oficina-billing-comandos
oficina.mensageria.outbox.agendamento-habilitado=true
oficina.mensageria.outbox.intervalo-ms=1000
oficina.mensageria.outbox.lote=50
oficina.mensageria.outbox.retencao-dias=7

# Mercado Pago (Orders API). Access token e segredo do webhook vêm das credenciais da aplicação no
# painel do Mercado Pago; em produção, de Secret do Kubernetes. Sem eles, cobrança e webhook falham.
mercadopago.url=${MERCADOPAGO_URL:https://api.mercadopago.com}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# Pagador da cobrança Pix (a Orders API exige um). Em teste, MERCADOPAGO_PAGADOR_NOME=APRO aprova o Pix no sandbox.
mercadopago.pagador.email=${MERCADOPAGO_PAGADOR_EMAIL:pagamentos@oficina.com.br}
mercadopago.pagador.nome=${MERCADOPAGO_PAGADOR_NOME:}

# JWT: só valida, não emite. Mesmo segredo da Lambda de autenticação e do OS Service; em produção vem
# de Secret do Kubernetes.
security.jwt.secret=${SECURITY_JWT_SECRET:jwt-local-secret-123456789012345678901234567890}

# Actuator: health com probes de liveness/readiness para o Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
