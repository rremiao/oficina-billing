apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: api
spec:
  # O HPA (hpa.yaml) ajusta as réplicas; várias réplicas são seguras: o outbox usa SKIP LOCKED, os
  # casos de uso são idempotentes e o pagamento tem trava otimista
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Sobe a versão nova antes de derrubar a antiga: o deploy não tira o serviço do ar
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      # preStop (10 s) + desligamento gracioso do Spring (até 20 s)
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-service
          image: oficina-billing
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            # Mantém o pod atendendo enquanto o Service e o Load Balancer o tiram da rotação: sem
            # isso, requisições ainda roteadas para o pod antigo falham durante o deploy
            preStop:
              exec:
                command: ["sleep", "10"]
          envFrom:
            - configMapRef:
                name: billing-service-config
            # Banco, JWT, RabbitMQ e Mercado Pago: criado pelo pipeline a partir dos GitHub Secrets
            # (nunca versionado)
            - secretRef:
                name: billing-service-secret
          # A JVM leva alguns segundos para subir com pouca CPU: a startupProbe segura as outras até a
          # aplicação responder, sem reiniciar o pod no meio da subida
          startupProbe:
            httpGet:
              path: /billing/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /billing/v1/actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /billing/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Raiz somente leitura: o Tomcat e a JVM só escrevem em /tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
