apiVersion: v1
kind: Service
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: api
spec:
  # ClusterIP na base; o overlay eks expõe com LoadBalancer, para o API Gateway encaminhar
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
