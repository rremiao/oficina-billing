# Cluster EKS do time (oficina-eks, namespace oficina). O Secret billing-service-secret é criado pelo
# pipeline a partir dos GitHub Secrets (scripts/deploy-k8s.sh). O RabbitMQ não está aqui: é o do OS
# Service, que precisa estar implantado antes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina
resources:
  - namespace.yaml
  - ../../base
  - newrelic-instrumentation.yaml
patches:
  - target:
      kind: ConfigMap
      name: billing-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: hml
      # Agent do New Relic (injetado pelo operator): nome da aplicação no APM, tracing distribuído
      # entre os serviços e logs (JSON, com correlationId) encaminhados com o trace
      - op: add
        path: /data/NEW_RELIC_APP_NAME
        value: oficina-billing
      - op: add
        path: /data/NEW_RELIC_LABELS
        value: "env:aws-academy;repo:oficina-billing;servico:billing"
      - op: add
        path: /data/NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
        value: "true"
      - op: add
        path: /data/NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
        value: "true"
      # Credenciais de teste do Mercado Pago (sandbox): o pagador APRO faz o sandbox aprovar o Pix
      # em alguns segundos, e o aviso do webhook confirma o pagamento sem intervenção manual
      - op: add
        path: /data/MERCADOPAGO_PAGADOR_NOME
        value: APRO
  - target:
      kind: Deployment
      name: billing-service
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          instrumentation.newrelic.com/inject-java: "true"
  # O API Gateway do time encaminha /billing/v1/** para o Load Balancer, inclusive o webhook do
  # Mercado Pago (fora do authorizer JWT)
  - target:
      kind: Service
      name: billing-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
